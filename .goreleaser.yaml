version: 2

project_name: cogni

before:
  hooks:
    - go mod tidy

builds:
  - id: cogni
    main: ./cmd/cogni
    binary: cogni
    # tree-sitter requires CGO. Cross-compiling CGO across the four targets
    # below needs a cross C toolchain in CI (zig cc or per-arch images);
    # wire that up before the v0.1 release tag.
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: cogni
    name_template: "cogni_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: islamborghini
    name: cogni
  draft: true
