version: 2

project_name: cogni

before:
  hooks:
    - go mod tidy

builds:
  - id: cogni
    main: ./cmd/cogni
    binary: cogni
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CC=zig-cc-darwin-amd64
          - CXX=zig-cxx-darwin-amd64
      - goos: linux
        goarch: amd64
        env:
          - CC=zig-cc-linux-amd64
          - CXX=zig-cxx-linux-amd64
      - goos: linux
        goarch: arm64
        env:
          - CC=zig-cc-linux-arm64
          - CXX=zig-cxx-linux-arm64

archives:
  - id: cogni
    name_template: "cogni_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

brews:
  - name: cogni
    repository:
      owner: islamborghini
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://getcogni.dev"
    description: "MCP server for AI coding agents — structured repo recall with 40-60% token reduction"
    license: "Apache-2.0"
    install: |
      bin.install "cogni"
    test: |
      system "#{bin}/cogni", "--version"

release:
  github:
    owner: islamborghini
    name: cogni
